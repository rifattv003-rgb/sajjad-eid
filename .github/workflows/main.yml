name: Render sajjad-eid

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Render Main composition
        run: npx remotion render src/index.ts Main out/sajjad-eid.mp4

      - name: Upload rendered video artifact
        uses: actions/upload-artifact@v4
        with:
          name: sajjad-eid-video
          path: out/sajjad-eid.mp4
